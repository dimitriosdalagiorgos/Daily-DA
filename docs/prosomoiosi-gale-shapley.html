<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Προσομοίωση ομίλων χρωμάτων</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Commissioner:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a single reading column for the story, wide scrollable figures for the flow diagrams and round queues */
:root {
  --bg: #f5f7fa; --surface: #ffffff; --ink: #18202e; --muted: #5b6577; --line: #d9dfe8; --soft: #eceff4;
  --accent: #3a4a8c;
  --g: #23935a; --b: #2d68cf; --r: #cf3f3f; --y: #d9a514; --out: #8a93a3;
  --g-t: #dcf1e5; --b-t: #dde8fb; --r-t: #fbe1e1; --y-t: #fbf0cf; --out-t: #eceef2;
  --y-ink: #6b5000;
  --f-display: "Literata", Georgia, "Times New Roman", serif;
  --f-body: "Commissioner", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121722; --surface: #1a2130; --ink: #e7ebf2; --muted: #9aa4b5; --line: #2e3748; --soft: #222a3a;
  --accent: #a9b6f0;
  --g: #3cbf7a; --b: #5b8ef0; --r: #ef6b6b; --y: #f0c23a; --out: #7d8698;
  --g-t: #173a29; --b-t: #1b2c4f; --r-t: #47201f; --y-t: #40330d; --out-t: #262d3b;
  --y-ink: #f6d77a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121722; --surface: #1a2130; --ink: #e7ebf2; --muted: #9aa4b5; --line: #2e3748; --soft: #222a3a;
  --accent: #a9b6f0;
  --g: #3cbf7a; --b: #5b8ef0; --r: #ef6b6b; --y: #f0c23a; --out: #7d8698;
  --g-t: #173a29; --b-t: #1b2c4f; --r-t: #47201f; --y-t: #40330d; --out-t: #262d3b;
  --y-ink: #f6d77a; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 80px; }
.prose { max-width: 70ch; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: clamp(2rem, 5vw, 3.1rem); font-weight: 700; }
h2 { font-size: clamp(1.45rem, 3vw, 1.9rem); font-weight: 700; margin-top: 8px; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
section { display: flex; flex-direction: column; gap: 18px; padding-block: 44px; border-top: 1px solid var(--line); }
.eyebrow { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); }
.lede { font-size: 1.15rem; color: var(--muted); max-width: 62ch; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.hero-bands { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 26px; max-width: 520px; }
.hero-bands span { height: 10px; border-radius: 2px; }
.muted { color: var(--muted); }
ul.clean { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }

/* club chips */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px 1px 7px; border-radius: 999px; font-size: 0.86em; font-weight: 600; white-space: nowrap; background: var(--soft); }
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.chip.G { color: var(--g); background: var(--g-t); } .chip.B { color: var(--b); background: var(--b-t); }
.chip.R { color: var(--r); background: var(--r-t); } .chip.Y { color: var(--y-ink); background: var(--y-t); }
.chip.Y::before { background: var(--y); }
.tag-list { display: inline-block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 0 5px; border-radius: 3px; border: 1px solid var(--accent); color: var(--accent); vertical-align: 1px; }

/* tables */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 0.95rem; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--soft); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: center; }

/* counts */
.counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.count-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.bar-row { display: grid; grid-template-columns: 82px 1fr 18px; align-items: center; gap: 8px; font-size: 0.88rem; }
.bar { height: 12px; border-radius: 2px; }

/* lottery */
.lottery { display: flex; flex-direction: column; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
.lot-row { display: grid; grid-template-columns: 150px repeat(8, minmax(64px, 1fr)); gap: 6px; align-items: stretch; min-width: 720px; }
.lot-row > .lbl { font-size: 0.82rem; color: var(--muted); align-self: center; }
.lot-cell { border: 1px solid var(--line); border-radius: 6px; padding: 6px 4px; text-align: center; font-size: 0.82rem; line-height: 1.3; background: var(--bg); }
.lot-cell b { display: block; font-family: var(--f-mono); font-size: 1.05rem; }
.lot-cell.win b { color: var(--accent); }

/* callout */
.callout { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; max-width: 78ch; }

/* queue figure (shared with round viewer) */
.queue { display: flex; flex-direction: column; gap: 4px; }
.q-item { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); font-size: 0.92rem; }
.q-item .pos { font-family: var(--f-mono); color: var(--muted); font-size: 0.8rem; }
.q-item .who { min-width: 0; }
.q-item .sub { display: block; font-size: 0.78rem; line-height: 1.35; color: var(--muted); }
.q-cut { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin: 4px 0; }
.q-cut::before, .q-cut::after { content: ""; flex: 1; border-top: 2px dashed var(--muted); }
.st { font-size: 0.74rem; font-weight: 700; padding: 1px 7px; border-radius: 4px; white-space: nowrap; }
.st.accepted { background: var(--g-t); color: var(--g); }
.st.retained { background: var(--soft); color: var(--muted); }
.st.rejected { background: var(--r-t); color: var(--r); }
.st.displaced { background: var(--r); color: var(--surface); }

/* flow diagram */
.flow-shell { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.flow-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.flow-tools .lbl { font-size: 0.82rem; color: var(--muted); margin-right: 4px; }
button.pill { font: inherit; font-size: 0.85rem; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
button.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button.pill:focus-visible, button.nav:focus-visible, .col-hit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.flow { display: block; }
svg.flow text { font-family: var(--f-body); fill: var(--ink); }
svg.flow .colhead { font-size: 13px; font-weight: 700; }
svg.flow .colsub { font-size: 11px; fill: var(--muted); }
svg.flow .boxlbl { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; }
svg.flow .seatname { font-size: 12.5px; font-weight: 600; }
svg.flow .seatnum { font-size: 11px; font-family: var(--f-mono); fill: var(--muted); }
svg.flow .ribbon { transition: opacity .2s; }
svg.flow.dim .ribbon { opacity: 0.08; }
svg.flow.dim .ribbon.on { opacity: 0.85; }
svg.flow.dim .seat { opacity: 0.35; }
svg.flow.dim .seat.on { opacity: 1; }
svg.flow .colbg { fill: transparent; }
svg.flow .colbg.sel { fill: var(--soft); }
.col-hit { cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 12px; border-radius: 3px; display: inline-block; }

/* round viewer */
.rounds { display: flex; flex-direction: column; gap: 14px; }
.round-nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button.nav { font: inherit; font-weight: 600; font-size: 0.9rem; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
button.nav:disabled { opacity: 0.4; cursor: default; }
.round-title { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; margin-right: auto; }
.round-say { max-width: 75ch; }
.club-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.club-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; border-top: 5px solid var(--club); min-width: 0; }
.club-card.idle { opacity: 0.6; }
.club-card h4 { margin: 0; font-size: 1rem; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.club-card h4 small { font-weight: 500; color: var(--muted); font-size: 0.78rem; }
.club-card .idle-note { font-size: 0.85rem; color: var(--muted); }

/* compare */
.delta-up { color: var(--g); font-weight: 700; } .delta-down { color: var(--r); font-weight: 700; }
.takeaways { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.takeaways > div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.takeaways b.k { font-family: var(--f-display); font-size: 1.05rem; }
footer { padding-top: 30px; border-top: 1px solid var(--line); font-size: 0.85rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { svg.flow .ribbon { transition: none; } }
@media (max-width: 560px) { body { font-size: 16px; } .wrap { padding-inline: 16px; } }
</style>
<style>
/* animated stage */
.anim { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.anim-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.anim-step { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; margin-right: auto; }
.anim-step small { font-family: var(--f-body); font-weight: 500; color: var(--muted); font-size: 0.85rem; margin-left: 6px; }
button.nav.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 9.5em; }
.anim-progress { display: flex; gap: 3px; }
.anim-progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--soft); }
.anim-progress i.done { background: var(--accent); }
.stage-scroll { overflow-x: auto; }
.stage { position: relative; min-width: 640px; }
.zone-lbl { position: absolute; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.cbox { position: absolute; border: 1.5px solid var(--club); background: var(--club-t); border-radius: 8px; }
.cbox b { position: absolute; left: 9px; top: 4px; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--club-ink); }
.seat-ph { position: absolute; border: 1.5px dashed var(--club); border-radius: 6px; opacity: 0.45; }
.lobby { position: absolute; border: 1.5px dashed var(--out); border-radius: 8px; background: var(--out-t); }
.token, .seat-ph, .cbox, .lobby { box-sizing: border-box; }
.token { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 0 8px; border-radius: 6px; background: var(--surface); border: 1.5px solid var(--line); font-size: 0.86rem; font-weight: 600; white-space: nowrap; box-shadow: 0 1px 2px rgba(0,0,0,.08);
  transition: transform .75s cubic-bezier(.3,.7,.2,1), border-color .3s, box-shadow .3s, background-color .3s; z-index: 2; }
.token .ln { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); font-weight: 500; }
.token .lt { font-size: 0.6rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 3px; margin-left: 2px; }
.token .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.token.at { border-color: var(--club); }
.token.lose { border: 2px dashed var(--r); background: var(--r-t); }
.token.out { border: 2px solid var(--r); }
.token.win { box-shadow: 0 0 0 3px var(--accent); z-index: 3; }
.token.final { border-color: var(--club); border-width: 2px; }
.token .tagx { position: absolute; left: 50%; top: -9px; transform: translateX(-50%); font-size: 0.6rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--r); color: var(--surface); padding: 0 5px; border-radius: 3px; }
.anim-say { min-height: 6.2em; display: flex; flex-direction: column; gap: 6px; max-width: 80ch; }
.anim-say p { margin: 0; }
.anim-say .push { color: var(--r); font-weight: 700; }
.anim-say .ok { color: var(--g); font-weight: 700; }
.qline { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 0.9rem; }
.qline .qn { padding: 0 7px; border-radius: 4px; background: var(--soft); }
.qline .qn.lose { background: var(--r-t); color: var(--r); text-decoration: line-through; }
.qline .cut { width: 2px; height: 1.2em; background: var(--muted); margin: 0 4px; }
@media (prefers-reduced-motion: reduce) { .token { transition: none; } }
</style>
<style>
.viz-shell { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.viz-scroll { border-radius: 8px; background: var(--bg); }
svg.viz { display: block; height: auto; }
svg.viz text { font-family: var(--f-body); }
svg.viz .vcol { fill: transparent; transition: fill .4s; }
svg.viz .vcol.sel { fill: var(--soft); }
svg.viz .vhead { font-size: 14px; font-weight: 700; fill: var(--ink); font-family: var(--f-display); }
svg.viz .vsub { font-size: 11px; fill: var(--muted); }
svg.viz .vbox { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; }
svg.viz .vcard rect { fill: var(--surface); stroke-width: 1.6; }
svg.viz .vname { font-size: 13px; font-weight: 600; fill: var(--ink); }
svg.viz .vlot { font-size: 11.5px; font-family: var(--f-mono); fill: var(--muted); }
svg.viz .vcard { transition: opacity .4s; }
svg.viz .vcard.past { opacity: .5; }
svg.viz .vcard.moving rect { stroke: var(--accent); stroke-width: 2.2; }
svg.viz .vcard.winner rect { stroke: var(--accent); stroke-width: 3; }
svg.viz .vcard.hit rect { stroke: var(--r); stroke-width: 2.4; fill: var(--r-t); }
svg.viz .vcard.hit { animation: shake .35s 2; }
svg.viz .vcard.ousted rect { stroke: var(--r); stroke-width: 1.8; }
svg.viz .vcard.final rect { stroke-width: 2.6; }
svg.viz .vtrace { fill: none; stroke-width: 9; stroke-linecap: round; opacity: .2; }
svg.viz .vtrace.red { stroke-width: 3; opacity: .45; stroke-dasharray: 5 5; }
svg.viz .varrow { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 9 9; animation: flow .6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -18; } }
@keyframes shake { 0%,100% { translate: 0 0; } 25% { translate: -3px 0; } 75% { translate: 3px 0; } }
.viz-say { min-height: 7.5em; display: flex; flex-direction: column; gap: 6px; max-width: 86ch; }
.viz-say p { margin: 0; }
.viz-say p.was { color: var(--muted); }
.viz-say p.was .chip { opacity: .7; }
.viz-say p.now { font-size: 1.04rem; }
.viz-say .push { color: var(--r); font-weight: 700; }
.viz-say .ok { color: var(--g); font-weight: 700; }
.viz-say .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); vertical-align: 1px; }
@media (prefers-reduced-motion: reduce) { svg.viz .varrow, svg.viz .vcard.hit { animation: none; } }
</style>
<style>
svg.viz .vpin .needle { stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; }
svg.viz .vpin .collar { fill: #8f1d1d; }
svg.viz .vpin .head { fill: #e0302b; stroke: #8f1d1d; stroke-width: 1; }
svg.viz .vpin .shine { fill: #fff; opacity: .55; }
svg.viz .vpin-in { transform-box: fill-box; }
svg.viz .vcard.thud > rect { animation: thud .32s ease-out; }
@keyframes thud { 0% { stroke-width: 4; } 100% { stroke-width: 1.6; } }
svg.viz .vladder .missed, svg.viz .vladder .below { opacity: .28; }
svg.viz .vladder .got { stroke: var(--ink); stroke-width: 2; }
svg.viz .vladder .strike { stroke: var(--ink); stroke-width: 1.4; opacity: .7; }
svg.viz .vladder { animation: pop .35s ease-out both; }
@keyframes pop { from { opacity: 0; } to { opacity: 1; } }
svg.viz .vrank { font-size: 12.5px; font-weight: 700; fill: var(--ink); font-family: var(--f-mono); }
.viz-say .pinned { color: #d42a25; font-weight: 700; }
.rkbar { display: inline-flex; width: min(360px, 100%); height: 22px; border-radius: 4px; overflow: hidden; vertical-align: middle; margin-right: 8px; }
.rkbar .rk { display: flex; align-items: center; justify-content: center; font-size: 0.74rem; font-weight: 700; color: var(--surface); white-space: nowrap; overflow: hidden; }
.rk.r1 { background: var(--accent); } .rk.r2 { background: color-mix(in srgb, var(--accent) 72%, var(--bg)); }
.rk.r3 { background: color-mix(in srgb, var(--accent) 50%, var(--bg)); color: var(--ink); } .rk.r4 { background: color-mix(in srgb, var(--accent) 30%, var(--bg)); color: var(--ink); }
.open-sim { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--accent); text-decoration: none; border: 1px solid var(--accent); border-radius: 6px; padding: 6px 12px; align-self: flex-start; }
.open-sim:hover { background: var(--soft); }
@media (prefers-reduced-motion: reduce) { svg.viz .vladder, svg.viz .vcard.thud > rect { animation: none; } }
</style>
<style>
svg.viz .pq { transition: opacity .35s; }
svg.viz .pq.missed, svg.viz .pq.below { opacity: .3; }
svg.viz .pq.got { stroke: var(--ink); stroke-width: 1.5; }
svg.viz .pqx { stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; opacity: 0; transition: opacity .35s; }
svg.viz .pqx.on { opacity: .9; }
</style>

<body>
<style>
html, body { height: 100%; }
body { overflow: hidden; font-size: 16px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 8px; padding-inline: 16px; padding-block: 10px; box-sizing: border-box; }
.app-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.app-head h1 { font-size: 1.25rem; }
.app-head .sub { color: var(--muted); font-size: 0.85rem; }
.scen { display: flex; gap: 6px; margin-left: auto; }
.viz-shell.fit { min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 8px; padding: 10px 12px; }
.viz-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.viz-top .anim-bar { flex: 1 1 520px; }
.fit .viz-scroll { min-height: 0; overflow: hidden; display: flex; }
.fit svg.viz { width: 100%; height: 100%; }
.fit .viz-say { min-height: 0; height: 7.6em; overflow-y: auto; max-width: none; font-size: 0.95rem; padding-right: 6px; }
.keys { font-size: 0.78rem; color: var(--muted); }

    return p;
  }
  async function travel(g, path, ms, my) {
    const len = path.getTotalLength();
    const t0 = performance.now();
    if (REDUCED || ms <= 0) { const pt = path.getPointAtLength(len); g.setAttribute("transform", `translate(${pt.x},${pt.y})`); return; }
    await new Promise((res) => {
      const f = (now) => {
        if (my !== gen) return res();
        const t = Math.min(1, (now - t0) / ms), pt = path.getPointAtLength(ease(t) * len);
        g.setAttribute("transform", `translate(${pt.x},${pt.y})`);
        t < 1 ? requestAnimationFrame(f) : res();
      };
      requestAnimationFrame(f);
    });
  }
  const D = (ms) => (REDUCED ? 0 : ms * speed);

  // text for one event
  const pri = (am, code) => listed(am, code) ? `<span class="tag-list">λίστα</span>` : `λαχνός <span class="mono">${BY_AM[am].lot}</span>`;
  function describe(e) {
    if (e.kind === "round") {
      const head = e.col === 1
        ? `<b>Γύρος 1.</b> Όλες κάνουν αίτηση στην 1η τους επιλογή. Οι αιτήσεις φτάνουν μία-μία, με τη σειρά του ΑΜ· η σειρά άφιξης δεν αλλάζει το αποτέλεσμα.`
        : `<b>Γύρος ${e.n}.</b> ${e.retained.length ? `Όσες έχουν θέση την κρατούν <b>προσωρινά</b> και στη νέα στήλη.` : ""} Όσες είναι στην αναμονή κάνουν αίτηση στην επόμενη επιλογή τους.`;
      return head;
    }
    if (e.kind === "end") {
      const cnt = [0, 0, 0, 0];
      for (const am in finalPos) cnt[BY_AM[am].prefs.indexOf(finalPos[am].box)]++;
      const tot = cnt.reduce((a, b) => a + b, 0);
      const avg = (cnt.reduce((a, n, i) => a + n * (i + 1), 0) / tot).toFixed(2).replace(".", ",");
      const segs = cnt.map((n, i) => n ? `<span class="rk r${i + 1}" style="flex:${n}">${ORD[i]} · ${n}</span>` : "").join("");
      return `<b>Τέλος.</b> Δεν υπάρχει καμία νέα αίτηση, οπότε οι θέσεις της τελευταίας στήλης γίνονται <b>οριστικές</b>. Δίπλα σε κάθε κάρτα, τα τετραγωνάκια είναι οι 4 επιλογές της μαθήτριας με τη σειρά, στο χρώμα κάθε ομίλου: το τονισμένο είναι ο όμιλος που πήρε, τα διαγραμμένα όσα ήθελε περισσότερο αλλά δεν χώρεσε.</p><p class="now"><span class="rkbar">${segs}</span> <span class="muted">μέση θέση στη λίστα: ${avg}</span>`;
    }
    const who = `<b>${nm(e.am)}</b> (${pri(e.am, e.club)}) → ${chip(e.club)} <span class="muted">${ORD[e.rank - 1]} επιλογή</span>`;
    const pinNote = listed(e.am, e.club) ? ` Είναι στη λίστα της καθηγήτριας, οπότε <span class="pinned">καρφώνεται</span> στη θέση της: καμία δεν μπορεί να τη σπρώξει έξω.` : "";
    if (e.result === "seat") return `${who}: υπάρχει <span class="ok">κενή θέση</span> και την παίρνει${listed(e.am, e.club) ? "." : " προσωρινά."}${pinNote}`;
    const w = e.result === "push" ? e.pushed : e.others[e.slot];
    const reason = listed(e.am, e.club) && !listed(w, e.club)
      ? `η ${nm(e.am)} είναι στη λίστα της καθηγήτριας, ενώ η ${nm(w)} όχι`
      : !listed(e.am, e.club) && listed(w, e.club)
        ? `η ${nm(w)} είναι στη λίστα της καθηγήτριας`
        : `${BY_AM[e.am].lot} ${e.result === "push" ? "<" : ">"} ${BY_AM[w].lot}`;
    if (e.result === "push") {
      const was = e.pushedSince && e.pushedSince < e.n ? `, παρόλο που ήταν εκεί από τον γύρο ${e.pushedSince}` : "";
      return `${who}: ο όμιλος είναι γεμάτος. Η πιο αδύναμη εκεί είναι η ${nm(w)} (${pri(w, e.club)}). Επειδή ${reason}, <span class="push">η ${nm(e.am)} σπρώχνει έξω ${ART(w)} ${nm(w)}</span>${was}.${pinNote}`;
    }
    return `${who}: ο όμιλος είναι γεμάτος, και ακόμα και η πιο αδύναμη εκεί, η ${nm(w)} (${pri(w, e.club)}), προηγείται (${reason}). <span class="push">Η ${nm(e.am)} απορρίπτεται</span> και περιμένει.`;
  }

  // apply one event; animate or snap
  async function apply(e, anim, my) {
    if (e.kind === "round") {
      drawColumn(e.col);
      const moves = e.retained.map((r) => {
        const to = { col: e.col, box: r.club, slot: r.slot };
        const d = curve(center(r.from), center(to));
        trace(d, ccol(r.club));
        const src = cards[`${r.from.col}:${r.am}`];
        src && src.classList.add("past");
        const g = makeCard(r.am, r.from, "", false); setCardBox(g, to);
        cards[`${e.col}:${r.am}`] = g;
        const p = sv("path", { d }); p.style.display = "none"; L.arrows.append(p);
        return { g, p };
      });
      if (anim && moves.length) await Promise.all(moves.map((m) => travel(m.g, m.p, D(700), my)));
      else for (const m of moves) await travel(m.g, m.p, 0, my);
      moves.forEach((m) => m.p.remove());
      return;
    }
    if (e.kind === "end") {
      const fin = Object.keys(cards).filter((k) => k.startsWith(`${e.col}:`)).map((k) => cards[k]);
      fin.forEach((g) => g.classList.add("final"));
      const ordered = STUDENTS.filter((s) => cards[`${e.col}:${s.am}`]);
      for (const [i, s] of ordered.entries()) {
        const p = finalPos[s.am];
        drawLadder(s.am, p);
        if (anim) await wait(D(160));
        if (my !== gen) return;
      }
      return;
    }
    const to = { col: e.col, box: e.club, slot: e.slot };
    const color = ccol(e.club);
    const src = cards[`${e.from.col}:${e.am}`];
    src && src.classList.add("past");
    // stop just touching the seated card's left side
    const edge = [center(to)[0] - (BW - 10) + 6, center(to)[1]];
    const d = curve(center(e.from), e.result === "seat" ? center(to) : edge);
    const g = makeCard(e.am, e.from, "moving", false);
    prefState(g, e.club);
    if (anim) {
      const arrow = glowArrow(d, color, e.club);
      await wait(D(350));
      if (my !== gen) return;
      await travel(g, arrow, D(1100), my);
      arrow.remove();
    } else { const p = sv("path", { d }); L.arrows.append(p); await travel(g, p, 0, my); p.remove(); }
    trace(d, color);
    if (my !== gen) return;
    if (e.result === "seat") {
      const q = setCardBox(g, to); g.classList.remove("moving"); cards[`${e.col}:${e.am}`] = g;
      if (anim) await dropPin(q, my);
      return;
    }
    const outP = { col: e.col, box: "OUT", slot: e.outSlot };
    if (e.result === "push") {
      // the newcomer stops at the club's edge, knocks the weaker card out, then takes its seat
      const victim = cards[`${e.col}:${e.pushed}`];
      cards[`${e.col}:${e.am}`] = g;
      const dd = dropCurve(center(to), center(outP));
      const slide = sv("path", { d: `M${edge[0]},${edge[1]} L${center(to)[0]},${center(to)[1]}` });
      slide.style.display = "none"; L.arrows.append(slide);
      if (anim) {
        g.classList.add("winner");
        await wait(D(250));
        victim.classList.add("hit");
        prefState(victim, "OUT", e.club);
        await wait(D(500));
        if (my !== gen) return;
        const a2 = glowArrow(dd, "var(--r)", "X");
        await wait(D(250));
        if (my !== gen) return;
        const out = travel(victim, a2, D(900), my);
        await wait(D(220));
        await travel(g, slide, D(450), my);
        await out;
        a2.remove(); g.classList.remove("winner");
      } else {
        const p = sv("path", { d: dd }); L.arrows.append(p); await travel(victim, p, 0, my); p.remove();
        await travel(g, slide, 0, my);
      }
      slide.remove();
      trace(dd, "var(--r)", true);
      victim.classList.remove("hit"); victim.classList.add("ousted"); setCardBox(victim, outP, e.club);
      const q = setCardBox(g, to); g.classList.remove("moving");
      if (anim) await dropPin(q, my);
      return;
    }
    // bounce
    g.classList.add("hit");
    prefState(g, "OUT", e.club);
    const db = bounceCurve(edge, center(outP));
    if (anim) {
      await wait(D(450));
      const a2 = glowArrow(db, "var(--r)", "X");
      await wait(D(250));
      await travel(g, a2, D(800), my);
      a2.remove();
    } else { const p = sv("path", { d: db }); L.arrows.append(p); await travel(g, p, 0, my); p.remove(); }
    trace(db, "var(--r)", true);
    g.classList.remove("hit", "moving"); g.classList.add("ousted"); setCardBox(g, outP, e.club);
    cards[`${e.col}:${e.am}`] = g;
  }

  function header(i) {
    const e = events[Math.max(0, i - 1)];
    if (i === 0) return `Αρχή<small>πατήστε Αναπαραγωγή ή Βήμα →</small>`;
    if (e.kind === "end") return `Τέλος<small>${cols - 1} γύροι</small>`;
    return `Γύρος ${e.n}<small>${e.kind === "round" ? "νέα στήλη" : "αίτηση της " + nm(e.am)}</small>`;
  }
  function narrate(i) {
    // events of the current round up to i
    let s = i - 1; while (s > 0 && events[s].kind !== "round") s--;
    const lines = [];
    if (i === 0) lines.push(`<p>Στην πρώτη στήλη είναι όλες οι μαθήτριες, με τη σειρά του λαχνού τους. Κάθε φορά που ένας όμιλος είναι γεμάτος, η κάρτα που φτάνει συγκρίνεται με την πιο αδύναμη κάρτα του ομίλου: πρώτα μετράει η λίστα της καθηγήτριας <span class="dot"></span>, μετά ο μικρότερος λαχνός.</p>`);
    else for (let j = s; j < i; j++) lines.push(`<p class="${j === i - 1 ? "now" : "was"}">${describe(events[j])}</p>`);
    say.innerHTML = lines.join("");
    if (FIT) say.scrollTop = say.scrollHeight;
  }
  function focusCol(i) {
    const c = i === 0 ? 0 : events[i - 1].col;
    L.bg.querySelectorAll(".vcol").forEach((r) => r.classList.toggle("sel", +r.dataset.col === c));
    const rect = L.bg.querySelector(`.vcol[data-col="${c}"]`);
    if (rect && scroller.scrollWidth > scroller.clientWidth) {
      const r = rect.getBoundingClientRect(), s = scroller.getBoundingClientRect();
      if (r.right > s.right - 10 || r.left < s.left) scroller.scrollBy({ left: r.right - s.right + 40, behavior: REDUCED ? "auto" : "smooth" });
    }
  }
  function ui(i) {
    step.innerHTML = header(i);
    [...prog.children].forEach((x, n) => x.classList.toggle("done", n < i));
    prev.disabled = i === 0; next.disabled = end.disabled = i === events.length;
    narrate(i); focusCol(i);
  }
  async function rebuild(i) {
    const my = ++gen;
    for (const k in L) L[k].innerHTML = "";
    for (const k in cards) delete cards[k];
    drawColumn(0);
    STUDENTS.forEach((s) => { const g = makeCard(s.am, { col: 0, box: "START", slot: [...STUDENTS].sort((a, b) => a.lot - b.lot).findIndex((x) => x.am === s.am) }); g.dataset.am = s.am; });
    for (let j = 0; j < i; j++) await apply(events[j], false, my);
    cur = i; ui(i);
  }
  async function forward() {
    if (cur >= events.length) return false;
    const my = gen;
    const e = events[cur];
    cur++; ui(cur);
    await apply(e, true, my);
    return my === gen;
  }
  function stop() { playing = false; gen++; play.textContent = "▶ Αναπαραγωγή"; }
  async function run() {
    if (cur >= events.length) await rebuild(0);
    playing = true; play.textContent = "❚❚ Παύση";
    const my = gen;
    while (playing && my === gen && cur < events.length) {
      const ok = await forward();
      if (!ok || my !== gen) return;
      await wait(D(events[cur - 1].kind === "round" ? 500 : 900));
    }
    if (my === gen) { playing = false; play.textContent = "▶ Αναπαραγωγή"; }
  }
  play.addEventListener("click", async () => {
    if (playing) { const c = cur; stop(); await rebuild(c); } else run();
  });
  next.addEventListener("click", async () => {
    if (playing) { const c = cur; stop(); await rebuild(c); return; }
    const c = cur; gen++; await rebuild(c); forward();
  });
  prev.addEventListener("click", async () => { const c = cur; if (playing) stop(); else gen++; await rebuild(Math.max(0, c - 1)); });
  restart.addEventListener("click", async () => { stop(); await rebuild(0); });
  end.addEventListener("click", async () => { stop(); await rebuild(events.length); });
  rebuild(0);
  return {
    stop,
    key(ev) {
      if (ev.key === "ArrowRight") next.click();
      else if (ev.key === "ArrowLeft") prev.click();
      else if (ev.key === " ") play.click();
      else if (ev.key === "Home") restart.click();
      else if (ev.key === "End") end.click();
      else return false;
      return true;
    },
  };
}
(function () {
  const stage = document.getElementById("stage");
  let inst = null;
  function load(k) {
    inst?.stop();
    stage.innerHTML = "";
    inst = buildViz(stage, k, { fit: true });
    document.querySelectorAll(".scen [data-s]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.s === k)));
  }
  document.querySelectorAll(".scen [data-s]").forEach((b) => b.addEventListener("click", () => load(b.dataset.s)));
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea")) return;
    if (inst && inst.key(e)) e.preventDefault();
  });
  const fs = document.getElementById("fs");
  if (!document.documentElement.requestFullscreen) fs.hidden = true;
  fs.addEventListener("click", () => {
    (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => { fs.hidden = true; });
  });
  load(location.hash === "#B" ? "B" : "A");
})();
</script>
</body>
