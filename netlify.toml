# Netlify: the platform lives in platform/ (see platform/README.md).
[build]
  base = "platform"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Publish only when asked: a build runs only if one of the commits since
  # the last deploy has «[deploy]» in its message (each production deploy
  # uses Netlify credits). A manual «Trigger deploy» with nothing new, or the
  # first build, always runs. Exit 1 = build, exit 0 = skip.
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then exit 1; fi; msgs=$(git log --format=%B "$CACHED_COMMIT_REF..$COMMIT_REF" 2>/dev/null) || msgs=$(git log -1 --format=%B); echo "$msgs" | grep -qF "[deploy]" && exit 1; exit 0'

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
