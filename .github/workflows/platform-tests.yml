name: Platform tests

on:
  push:
    paths: ["platform/**", ".github/workflows/platform-tests.yml"]
  pull_request:
    paths: ["platform/**", ".github/workflows/platform-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
