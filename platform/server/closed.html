<!doctype html>
<!--
  Page that Apache shows while the platform is stopped (or restarting).
  Apache serves it as its "503" error page, so it must be self-contained:
  no scripts, no external files. Installed as a copy in /var/www/omiloi/
  (README §6.5, WORKFLOW §7.7); edit the copy there to change the text.
  Keep the meta tag name="omiloi": omiloi-status looks for it.
-->
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="omiloi" content="closed">
<title>Δηλώσεις ομίλων</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         background: #f4f6f8; color: #1f2933; }
  main { max-width: 32rem; margin: 1rem; padding: 2rem 1.5rem; background: #fff;
         border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); text-align: center; line-height: 1.5; }
  h1 { font-size: 1.35rem; margin: 0 0 1rem; }
  p { margin: .6rem 0; }
  .small { color: #52606d; font-size: .92rem; }
</style>
</head>
<body>
<main>
  <h1>Η πλατφόρμα δηλώσεων ομίλων είναι κλειστή</h1>
  <p>Η πλατφόρμα λειτουργεί μόνο την περίοδο των δηλώσεων, στην αρχή της σχολικής χρονιάς.</p>
  <p>Το σχολείο θα ανακοινώσει πότε ανοίγει ξανά.</p>
  <p class="small">Αν περιμένατε να είναι ανοιχτή τώρα, δοκιμάστε ξανά σε λίγα λεπτά.</p>
</main>
</body>
</html>
